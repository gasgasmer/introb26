<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>Vibe Coding - Face Controlled Robot Shooter</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    
    <style>
        /* Alapértelmezett margók nullázása, sötét háttér beállítása */
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }
        
        /* Fő játéktér, kitölti a teljes képernyőt */
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* Kamera UI a bal alsó sarokban */
        #camContainer {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 160px;
            height: 120px;
            border: 3px solid #00ffcc; /* Neon keret */
            border-radius: 12px;
            overflow: hidden;
            transform: scaleX(-1); /* Tükrözés a természetesebb felhasználói élményért */
            background: #000;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
        }

        /* Videó és rajzvászon a kamera konténeren belül */
        #videoElement, #overlayCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Kitölti a rendelkezésre álló helyet */
        }

        /* Kezdőképernyő és UI réteg */
        #uiLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center; /* Középre igazítás függőlegesen */
            align-items: center; /* Középre igazítás vízszintesen */
            background: rgba(0, 0, 0, 0.8); /* Félig átlátszó sötét háttér */
            z-index: 10;
        }

        /* Rejtett elemek osztálya */
        .hidden {
            display: none !important;
        }

        /* Főcím stílusa */
        h1 {
            color: #00ffcc;
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5); /* Neon ragyogás */
        }

        /* Leíró szöveg stílusa */
        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            text-align: center;
            max-width: 600px;
        }

        /* Gomb stílusa */
        button {
            padding: 15px 30px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #111;
            background-color: #00ffcc;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s; /* Animált hover hatás */
        }

        /* Gomb hover állapota */
        button:hover {
            transform: scale(1.05); /* Nagyítás egerészéskor */
            background-color: #00ccaa;
        }

        /* Pontszám kijelző stílusa */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 2rem;
            font-weight: bold;
            color: #00ffcc;
            pointer-events: none; /* Ne akadályozza a kattintást */
            text-shadow: 2px 2px 4px #000;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>
    
    <div id="hud">Pontszám: <span id="scoreValue">0</span></div>

    <div id="camContainer">
        <video id="videoElement" autoplay playsinline></video>
        <canvas id="overlayCanvas" width="160" height="120"></canvas>
    </div>

    <div id="uiLayer">
        <h1>Robot Defender</h1>
        <p>Irányítás: Döntsd a fejed jobbra-balra a forgáshoz!<br>Nyisd ki a szád a lézer elsütéséhez!</p>
        <button id="startBtn">Kamera engedélyezése és Indítás</button>
    </div>

    <script>
        // --- HTML Elemek lekérése ---
        const gameCanvas = document.getElementById('gameCanvas'); // Fő vászon
        const ctx = gameCanvas.getContext('2d'); // Fő rajzi kontextus
        const videoElement = document.getElementById('videoElement'); // Kamera videó
        const overlayCanvas = document.getElementById('overlayCanvas'); // Debug vászon
        const overlayCtx = overlayCanvas.getContext('2d'); // Debug rajzi kontextus
        const uiLayer = document.getElementById('uiLayer'); // UI réteg
        const startBtn = document.getElementById('startBtn'); // Indító gomb
        const scoreUI = document.getElementById('scoreValue'); // Pontszám szöveg

        // --- Játék Változók beállítása ---
        let width = window.innerWidth; // Ablak szélessége
        let height = window.innerHeight; // Ablak magassága
        gameCanvas.width = width; // Vászon szélesség beállítása
        gameCanvas.height = height; // Vászon magasság beállítása
        const zoomLevel = 0.6; // Kamera kicsinyítése (nagyobb térrészhez)

        // Ablak átméretezésének lekezelése
        window.addEventListener('resize', () => {
            width = window.innerWidth; // Új szélesség
            height = window.innerHeight; // Új magasság
            gameCanvas.width = width; // Vászon frissítése
            gameCanvas.height = height; // Vászon frissítése
        });

        let gameState = 'START'; // Játékállapot: START, PLAYING, GAMEOVER
        let score = 0; // Játékos pontszáma
        let lastTime = 0; // Utolsó képkocka ideje (deltaTime számításhoz)

        // Játékos (Robot) objektum
        let player = {
            angle: 0, // A forgás szöge radiánban
        };

        let enemies = []; // Ellenségeket tároló tömb
        let enemySpawnTimer = 0; // Időzítő új ellenségek generálásához
        let activeLaserTimer = 0; // Lézer láthatósági ideje képkockákban

        // Vezérlő jelek az AI-tól
        let currentHeadTilt = 0; // Aktuális simított fejdőlés
        let isMouthOpen = false; // Nyitva van-e a száj
        let mouthLatch = false; // Reteszelő mechanizmus lövéshez (csak egyszer lőjön egy nyitásra)

        // --- MediaPipe FaceMesh Inicializálás ---
        const faceMesh = new FaceMesh({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`; // Modellek betöltése CDN-ről
        }});

        // FaceMesh beállítások
        faceMesh.setOptions({
            maxNumFaces: 1, // Csak egy arcot figyelünk
            refineLandmarks: false, // Részletes íriszkövetés kikapcsolva (gyorsabb futás)
            minDetectionConfidence: 0.5, // Minimum detektálási pontosság
            minTrackingConfidence: 0.5 // Minimum követési pontosság
        });

        faceMesh.onResults(onResults); // Visszahívó függvény beállítása

        // --- AI Feldolgozás (Kliensoldal) ---
        function onResults(results) {
            overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height); // Debug vászon törlése

            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) { // Ha van detektált arc
                const landmarks = results.multiFaceLandmarks[0]; // Első arc pontjai

                // 1. Fejdőlés számítása (33-as: bal szem, 263-as: jobb szem)
                const leftEye = landmarks[33];
                const rightEye = landmarks[263];
                
                const dx = leftEye.x - rightEye.x; // X különbség (tükrözve)
                const dy = rightEye.y - leftEye.y; // Y különbség
                let tiltAngle = Math.atan2(dy, dx); // Dőlésszög kiszámítása radiánban
                
                // Zajszűrés: Pici dőlésnél 0-t adunk, hogy ne remegjen
                if (Math.abs(tiltAngle) < 0.05) tiltAngle = 0;
                
                // Finomítás (Low-pass filter): lágy átmenet a régi és új szög között
                currentHeadTilt = currentHeadTilt * 0.7 + tiltAngle * 0.3;

                // 2. Szájnyitás számítása
                const upperLip = landmarks[13]; // Felső ajak közepe
                const lowerLip = landmarks[14]; // Alsó ajak közepe
                const topHead = landmarks[10]; // Fejtető
                const chin = landmarks[152]; // Áll

                const mouthDist = Math.hypot(upperLip.x - lowerLip.x, upperLip.y - lowerLip.y); // Szájnyílás távolsága
                const faceDist = Math.hypot(topHead.x - chin.x, topHead.y - chin.y); // Teljes arc magassága
                
                const mouthRatio = mouthDist / faceDist; // Normalizált arány (méretfüggetlen)

                if (mouthRatio > 0.08) { // Ha a nyitottság eléri a küszöbértéket
                    isMouthOpen = true; // Száj nyitva
                    if (!mouthLatch && gameState === 'PLAYING') { // Ha nincs reteszelve és fut a játék
                        shoot(); // Lövés (lézer) elsütése
                        mouthLatch = true; // Reteszelés bekapcsolása
                    }
                } else {
                    isMouthOpen = false; // Száj csukva
                    mouthLatch = false; // Retesz feloldása újabb lövéshez
                }

                // --- Debug Rajzolás az Overlay Canvasra ---
                drawLandmark(leftEye, '#00ffcc'); // Bal szem jelölése
                drawLandmark(rightEye, '#00ffcc'); // Jobb szem jelölése
                drawLandmark(upperLip, isMouthOpen ? '#ff0000' : '#ffff00'); // Felső ajak jelölése (piros, ha nyitva)
                drawLandmark(lowerLip, isMouthOpen ? '#ff0000' : '#ffff00'); // Alsó ajak jelölése (piros, ha nyitva)
            }
        }

        // Segédfüggvény debug pontok rajzolásához
        function drawLandmark(point, color) {
            overlayCtx.fillStyle = color; // Szín beállítása
            overlayCtx.beginPath();
            overlayCtx.arc(point.x * overlayCanvas.width, point.y * overlayCanvas.height, 3, 0, 2 * Math.PI); // Kör rajzolása
            overlayCtx.fill(); // Kör kitöltése
        }

        // --- Játék Logika ---
        function shoot() {
            activeLaserTimer = 15; // Lézer vizuális megjelenítése 15 képkockáig
            
            // Sugár irányának kiszámítása (előre néz a játékos)
            let rayAngle = player.angle - Math.PI / 2; 
            let dx = Math.cos(rayAngle); // Sugár irányvektor X
            let dy = Math.sin(rayAngle); // Sugár irányvektor Y
            
            // Raycast (sugárkövetéses) ütközésvizsgálat minden ellenségre
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                
                // Vetítjük az ellenség koordinátáját a lézer egyenesére (skaláris szorzat)
                let t = e.x * dx + e.y * dy; 
                
                if (t > 0) { // Ha t > 0, az ellenség előttünk van (nem mögöttünk)
                    let closestX = t * dx; // A lézer legközelebbi pontja az ellenséghez (X)
                    let closestY = t * dy; // A lézer legközelebbi pontja az ellenséghez (Y)
                    
                    // Távolság az ellenség közepe és a lézer egyenese között
                    let distToLaser = Math.hypot(e.x - closestX, e.y - closestY); 
                    
                    // 10 a lézer vizuális "vastagságának" kompenzálása
                    if (distToLaser < e.radius + 10) { 
                        enemies.splice(i, 1); // Találat: ellenség eltávolítása
                        score += 10; // Pontszám növelése
                        scoreUI.innerText = score; // UI frissítése
                    }
                }
            }
        }

        // Játék alaphelyzetbe állítása
        function resetGame() {
            score = 0; // Pontszám nullázása
            scoreUI.innerText = score; // UI frissítése
            enemies = []; // Ellenségek törlése
            activeLaserTimer = 0; // Lézer kikapcsolása
            player.angle = 0; // Forgás nullázása
            gameState = 'PLAYING'; // Állapot váltása játékra
            uiLayer.classList.add('hidden'); // Menü elrejtése
        }

        // Játék állapotának frissítése (minden képkockán)
        function update(deltaTime) {
            if (gameState !== 'PLAYING') return; // Ha nem fut a játék, kilépünk

            // Lézer időzítő csökkentése
            if (activeLaserTimer > 0) {
                activeLaserTimer--;
            }

            // 1. Játékos forgatása fejkövetéssel és sebességkorláttal
            const deadzone = 0.08; // Holtsáv (ebben a tartományban nem forog a gép)
            if (Math.abs(currentHeadTilt) > deadzone) {
                let activeTilt = currentHeadTilt - Math.sign(currentHeadTilt) * deadzone; // Hasznos dőlés
                let desiredRotation = Math.sign(activeTilt) * Math.pow(activeTilt, 2) * 0.8; // Kívánt sebesség
                
                // Maximális szögsebesség korlátozása (10 mp / félfordulat = Math.PI / 10000 rad/ms)
                let maxRotation = (Math.PI / 10000) * deltaTime; 
                
                // Sebesség vágása (clamping) a maximumra
                if (desiredRotation > maxRotation) desiredRotation = maxRotation;
                if (desiredRotation < -maxRotation) desiredRotation = -maxRotation;

                player.angle += desiredRotation; // Szög frissítése a limitált értékkel
            }

            // 2. Ellenségek generálása
            enemySpawnTimer -= deltaTime; // Időzítő csökkentése
            if (enemySpawnTimer <= 0) {
                let spawnAngle = Math.random() * Math.PI * 2; // Véletlen irány
                // A spawn távolságot is megnöveljük a zoom arányával, hogy képernyőn kívülről jöjjenek
                let spawnDist = Math.max(width, height) / zoomLevel; 
                enemies.push({
                    x: Math.cos(spawnAngle) * spawnDist, // Kezdő X
                    y: Math.sin(spawnAngle) * spawnDist, // Kezdő Y
                    speed: 1 + Math.random() * 1, // Felezett véletlen sebesség
                    radius: 25 // Megnövelt méret (narancssárga ellenség)
                });
                // Ahogy nő a pontszám, úgy jönnek egyre gyakrabban
                enemySpawnTimer = Math.max(500, 2000 - score * 50); 
            }

            // 3. Ellenségek mozgatása és Ütközésvizsgálat a játékossal
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                
                // Ellenség mozog a középpont (0,0) felé
                let angleToCenter = Math.atan2(-e.y, -e.x); // Irány a középpontba
                e.x += Math.cos(angleToCenter) * e.speed; // X pozíció frissítése
                e.y += Math.sin(angleToCenter) * e.speed; // Y pozíció frissítése

                // Ütközés játékossal (A játékos sugara ~20)
                let distToPlayer = Math.hypot(e.x, e.y); // Távolság a középponttól (játékostól)
                if (distToPlayer < e.radius + 20) { // Ha összeérnek
                    gameState = 'GAMEOVER'; // Játék vége állapot
                    uiLayer.classList.remove('hidden'); // Menü megjelenítése
                    // Game Over képernyő tartalma
                    uiLayer.innerHTML = `<h1>GAME OVER</h1><p>Elértek az ellenségek!</p><h2>Pontszám: ${score}</h2><button onclick="resetGame()">Újra</button>`;
                    return; // Frissítés megszakítása
                }
            }
        }

        // --- Renderelés (Rajzolás) ---
        function drawGrid() {
            ctx.strokeStyle = '#333'; // Rács színe
            ctx.lineWidth = 1; // Vonalvastagság
            const gridSize = 100; // Egy rácselem mérete
            // A rácsnak a zoom miatt sokkal nagyobbnak kell lennie, hogy kitöltse a képernyőt
            const limit = Math.max(width, height) * 1.5 / zoomLevel; 
            
            ctx.beginPath();
            for (let i = -limit; i <= limit; i += gridSize) {
                ctx.moveTo(i, -limit); ctx.lineTo(i, limit); // Függőleges vonalak
                ctx.moveTo(-limit, i); ctx.lineTo(limit, i); // Vízszintes vonalak
            }
            ctx.stroke(); // Vonalak kirajzolása
        }

        // Fő rajzoló függvény
        function draw() {
            ctx.fillStyle = '#111'; // Háttérszín
            ctx.fillRect(0, 0, width, height); // Képernyő törlése/kitöltése

            if (gameState !== 'PLAYING') return; // Ha nem fut a játék, nem rajzolunk mást

            // ---- VILÁG RAJZOLÁSA (A kamera illúzióhoz) ----
            ctx.save(); // Kontextus elmentése
            ctx.translate(width / 2, height / 2); // Origó mozgatása a képernyő közepére
            ctx.scale(zoomLevel, zoomLevel); // Kicsinyítés (zoom out) a nagyobb térrészhez
            
            // A világot ellentétesen forgatjuk a játékos szögével, így a gép "felfelé" néz
            ctx.rotate(-player.angle);

            drawGrid(); // Rács megrajzolása

            // Lézersugár rajzolása (Ha aktív)
            if (activeLaserTimer > 0) {
                // Átlátszóság az időzítő alapján fade-out effektushoz
                ctx.strokeStyle = `rgba(0, 255, 204, ${activeLaserTimer / 15})`; 
                ctx.lineWidth = 10; // Lézer vastagsága
                ctx.beginPath();
                ctx.moveTo(0, 0); // Lézer indulópontja (játékos)
                // A lézer hossza kilóg a képernyőről (több ezer pixel messze)
                ctx.lineTo(Math.cos(player.angle - Math.PI / 2) * 3000, Math.sin(player.angle - Math.PI / 2) * 3000);
                ctx.stroke(); // Lézer kirajzolása
            }

            // Ellenségek rajzolása
            ctx.fillStyle = '#ff9900'; // Narancssárga szín
            for (let e of enemies) {
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.radius, 0, 2 * Math.PI); // Külső test
                ctx.fill();
                
                ctx.fillStyle = '#fff'; // Fehér belső mag
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.radius / 2, 0, 2 * Math.PI); // Belső kör
                ctx.fill();
                
                ctx.fillStyle = '#ff9900'; // Szín visszaállítása a következő ellenségnek
            }
            
            ctx.restore(); // Világ forgatás vége (visszatérés normál koordinátákra)

            // ---- JÁTÉKOS (ROBOT) RAJZOLÁSA ----
            ctx.save(); // Kontextus elmentése
            ctx.translate(width / 2, height / 2); // Játékos fixen a középpontban
            ctx.scale(zoomLevel, zoomLevel); // A robotot is lekicsinyítjük a világgal együtt
            
            ctx.fillStyle = '#00ffcc'; // Gép színe
            ctx.fillRect(-15, -15, 30, 30); // Test
            
            ctx.fillStyle = '#fff'; // Orr / fegyvercső
            ctx.fillRect(-5, -25, 10, 15); // Mutatja az irányt felfelé
            
            ctx.fillStyle = '#555'; // Kerekek
            ctx.fillRect(-20, -10, 5, 20); // Bal kerék
            ctx.fillRect(15, -10, 5, 20); // Jobb kerék

            ctx.restore(); // Rajzolás vége
        }

        // --- Fő Játék Ciklus ---
        function gameLoop(timestamp) {
            let deltaTime = timestamp - lastTime; // Eltelt idő számítása
            if (lastTime === 0) deltaTime = 0; // Első képkocka hiba javítása
            lastTime = timestamp; // Utolsó időpont frissítése

            update(deltaTime); // Logika frissítése
            draw(); // Képernyő újra-rajzolása

            requestAnimationFrame(gameLoop); // Következő képkocka kérése
        }

        // --- Rendszer Indítása ---
        startBtn.addEventListener('click', () => {
            // Tájékoztató szöveg amíg a kamera indul
            uiLayer.innerHTML = '<h2>Kamera indítása...</h2><p>Kérlek engedélyezd a böngészőben a kamera hozzáférést!</p>';
            
            // Kamera inicializálása
            const camera = new Camera(videoElement, {
                onFrame: async () => {
                    await faceMesh.send({image: videoElement}); // Képküldés a FaceMesh-nek
                },
                width: 320, // Alacsony felbontás a gyorsabb AI feldolgozásért
                height: 240,
                facingMode: "user" // Előlapi kamera
            });

            // Kamera indítása
            camera.start().then(() => {
                resetGame(); // Játék inicializálása
                lastTime = performance.now(); // Biztosítjuk a helyes kezdőidőt a deltaTimenak
                requestAnimationFrame(gameLoop); // Fő ciklus indítása
            }).catch(err => {
                // Hibakezelés (pl. nincs engedély)
                uiLayer.innerHTML = `<h1>Hiba!</h1><p>Nem sikerült elérni a kamerát: ${err.message}</p><button onclick="location.reload()">Újratöltés</button>`;
            });
        });
    </script>
</body>
</html>
